name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schedule-rules:
    name: Schedule rule tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run schedule rule tests
        run: dotnet run --project ServerScheduler.Tests/ServerScheduler.Tests.csproj -c Release
